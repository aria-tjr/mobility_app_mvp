version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart_mobility_postgres
    environment:
      POSTGRES_DB: smart_mobility
      POSTGRES_USER: mobility_user
      POSTGRES_PASSWORD: mobility_pass_2024
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - mobility_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smart_mobility_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - mobility_network

  # Backend API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_mobility_api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mobility_user:mobility_pass_2024@postgres:5432/smart_mobility
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - mobility_network

  # Motion Detection Service (Python ML)
  motion-detection:
    build:
      context: ./backend/motion-detection
      dockerfile: Dockerfile
    container_name: smart_mobility_motion
    ports:
      - "3001:3001"
    environment:
      PYTHONPATH: /app
      ML_MODEL_PATH: /app/models
    volumes:
      - ./backend/motion-detection:/app
    networks:
      - mobility_network

  # Vehicle Simulator
  vehicle-simulator:
    build:
      context: ./vehicle-simulator
      dockerfile: Dockerfile
    container_name: smart_mobility_simulator
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      API_GATEWAY_URL: http://api-gateway:3000
      MOTION_DETECTION_URL: http://motion-detection:3001
    depends_on:
      - api-gateway
      - motion-detection
    volumes:
      - ./vehicle-simulator:/app
      - /app/node_modules
    networks:
      - mobility_network

  # Frontend Dashboard
  operator-dashboard:
    build:
      context: ./frontend/operator-dashboard
      dockerfile: Dockerfile
    container_name: smart_mobility_dashboard
    ports:
      - "3003:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000
      REACT_APP_WS_URL: ws://localhost:3000
    depends_on:
      - api-gateway
    volumes:
      - ./frontend/operator-dashboard:/app
      - /app/node_modules
    networks:
      - mobility_network

volumes:
  postgres_data:
  redis_data:

networks:
  mobility_network:
    driver: bridge
